<script defer>
function getCSRFToken() {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, 'csrftoken'.length + 1) === ('csrftoken' + '=')) {
                cookieValue = decodeURIComponent(cookie.substring('csrftoken'.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// Единая функция показа уведомлений
function showNotification(message, type = 'success') {
    const oldNotifications = document.querySelectorAll('.notification');
    oldNotifications.forEach(notification => notification.remove());
    
    const notification = document.createElement('div');
    notification.className = `notification ${type}`;
    notification.textContent = message;
    
    notification.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 15px 20px;
        border-radius: 5px;
        color: white;
        font-weight: bold;
        z-index: 10000;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        animation: slideIn 0.3s ease-out;
        max-width: 400px;
        word-wrap: break-word;
    `;
    
    if (type === 'success') {
        notification.style.backgroundColor = '#4CAF50';
    } else if (type === 'error') {
        notification.style.backgroundColor = '#f44336';
    } else {
        notification.style.backgroundColor = '#ff9800';
    }
    
    document.body.appendChild(notification);
    
    setTimeout(() => {
        notification.style.animation = 'slideOut 0.3s ease-in';
        setTimeout(() => {
            if (notification.parentNode) {
                notification.parentNode.removeChild(notification);
            }
        }, 300);
    }, 5000);
}

document.addEventListener('DOMContentLoaded', function() {
    // ========== ЛОГИН ==========
    const loginForm = document.getElementById('login-form');
    if (loginForm) {
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const submitButton = this.querySelector('input[type="submit"]');
            const originalText = submitButton.value;
            
            submitButton.value = 'Вход...';
            submitButton.disabled = true;
            
            const errorElements = this.querySelectorAll('.error');
            errorElements.forEach(el => el.remove());

            fetch(this.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'X-CSRFToken': getCSRFToken(),
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showNotification('Вход выполнен успешно!', 'success');
                    setTimeout(() => {
                        window.location.href = data.redirect_url;
                    }, 1000);
                } else {
                    if (data.errors) {
                        Object.keys(data.errors).forEach(fieldName => {
                            const field = loginForm.querySelector(`[name="${fieldName}"]`);
                            if (field && fieldName !== 'general') {
                                const errorDiv = document.createElement('div');
                                errorDiv.className = 'error';
                                errorDiv.textContent = data.errors[fieldName][0];
                                field.parentNode.insertBefore(errorDiv, field.nextSibling);
                            }
                        });
                        if (data.errors.general) {
                            showNotification(data.errors.general[0], 'error');
                        }
                    }
                }
            })
            .catch(error => {
                showNotification('Ошибка соединения с сервером', 'error');
            })
            .finally(() => {
                submitButton.value = originalText;
                submitButton.disabled = false;
            });
        });
    }
    
    // ========== РЕГИСТРАЦИЯ ==========
    const registrationForm = document.getElementById('registration-form');
    if (registrationForm) {
        registrationForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const submitButton = this.querySelector('input[type="submit"]');
            const originalText = submitButton.value;
            
            submitButton.value = 'Регистрация...';
            submitButton.disabled = true;
            
            const errorElements = this.querySelectorAll('.error');
            errorElements.forEach(el => el.remove());

            fetch(this.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'X-CSRFToken': getCSRFToken(),
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showNotification('Регистрация прошла успешно!', 'success');
                    setTimeout(() => {
                        window.location.href = data.redirect_url;
                    }, 1000);
                } else {
                    if (data.errors) {
                        Object.keys(data.errors).forEach(fieldName => {
                            const field = registrationForm.querySelector(`[name="${fieldName}"]`);
                            if (field && fieldName !== 'general') {
                                const errorDiv = document.createElement('div');
                                errorDiv.className = 'error';
                                errorDiv.textContent = data.errors[fieldName][0];
                                field.parentNode.insertBefore(errorDiv, field.nextSibling);
                            }
                        });
                        if (data.errors.general) {
                            showNotification(data.errors.general[0], 'error');
                        }
                    }
                }
            })
            .catch(error => {
                showNotification('Ошибка соединения с сервером', 'error');
            })
            .finally(() => {
                submitButton.value = originalText;
                submitButton.disabled = false;
            });
        });
    }
    
    // ========== ЗАЯВКА ==========
    const applicationForm = document.getElementById('application-form');
    if (applicationForm) {
        applicationForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitButton = this.querySelector('#application-submit') || this.querySelector('button[type="submit"]');
            const originalText = submitButton ? submitButton.textContent || submitButton.value : 'Отправить';
            
            if (submitButton) {
                submitButton.disabled = true;
                if (submitButton.tagName === 'BUTTON') {
                    submitButton.textContent = 'Отправка...';
                } else {
                    submitButton.value = 'Отправка...';
                }
            }
            
            const formData = new FormData(this);
            
            const errorElements = this.querySelectorAll('.error');
            errorElements.forEach(el => el.remove());

            fetch(this.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'X-CSRFToken': getCSRFToken(),
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showNotification(data.message || 'Заявка успешно отправлена!', 'success');
                    this.reset();
                    if (data.redirect_url) {
                        setTimeout(() => {
                            window.location.href = data.redirect_url;
                        }, 1500);
                    }
                } else {
                    if (data.errors) {
                        Object.keys(data.errors).forEach(fieldName => {
                            const field = applicationForm.querySelector(`[name="${fieldName}"]`);
                            if (field) {
                                const errorDiv = document.createElement('div');
                                errorDiv.className = 'error';
                                const errorText = Array.isArray(data.errors[fieldName]) 
                                    ? data.errors[fieldName].join(', ') 
                                    : data.errors[fieldName];
                                errorDiv.textContent = errorText;
                                field.parentNode.insertBefore(errorDiv, field.nextSibling);
                            }
                        });
                    }
                    showNotification(data.message || 'Ошибка при отправке заявки', 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showNotification('Ошибка соединения с сервером', 'error');
            })
            .finally(() => {
                if (submitButton) {
                    submitButton.disabled = false;
                    if (submitButton.tagName === 'BUTTON') {
                        submitButton.textContent = originalText;
                    } else {
                        submitButton.value = originalText;
                    }
                }
            });
        });
    }
    
    // Добавляем CSS анимации, если их нет
    if (!document.querySelector('#notification-styles')) {
        const style = document.createElement('style');
        style.id = 'notification-styles';
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
            .error {
                color: #f44336;
                font-size: 13px;
                margin-top: 5px;
                margin-bottom: 5px;
                padding-left: 5px;
                border-left: 3px solid #f44336;
            }
            .notification {
                font-size: 14px;
            }
        `;
        document.head.appendChild(style);
    }
});
</script>
